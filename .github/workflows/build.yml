# The build robot. On every change it runs the tests and builds an installable APK.
# Changes to main also publish the APK as a "release", so it can be downloaded on the phone.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew testDebugUnitTest :core:model:test --stacktrace

      - name: Build APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/food-diary-0.1.${GITHUB_RUN_NUMBER}.apk"

      - name: Keep the APK with this build
        uses: actions/upload-artifact@v4
        with:
          name: food-diary-0.1.${{ github.run_number }}
          path: out/*.apk

      - name: Keep test reports when tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

      - name: Publish as the latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Food diary 0.1.${{ github.run_number }}
          body: Automatic build of ${{ github.sha }}. Download the .apk file below on your phone to install.
          files: out/*.apk
          make_latest: true
