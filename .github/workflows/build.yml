# The build robot. On every change it runs the tests and builds an installable APK.
# Changes to main also publish the APK as a "release", so it can be downloaded on the phone.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # On pull requests, check out the branch itself so the schema step below can push to it.
          ref: ${{ github.head_ref || github.ref }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: .github/scripts/gradle-with-annotations.sh testDebugUnitTest :core:model:test

      - name: Save the database layout (Room schema) to the branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ ! -d core/data/schemas ]; then
            echo "::error title=Schema::Room did not write core/data/schemas"
            find . -path '*/schemas/*' -name '*.json' | head -5 | sed 's/^/::error title=Schema found::/'
            exit 1
          fi
          git add core/data/schemas
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
            git commit -m "Save Room database schema [skip ci]"
            git push origin "HEAD:${GITHUB_HEAD_REF}" 2>&1 | sed 's/^/::error title=Push::/'
            exit "${PIPESTATUS[0]}"
          fi

      - name: Build APK
        run: .github/scripts/gradle-with-annotations.sh :app:assembleRelease

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/food-diary-0.1.${GITHUB_RUN_NUMBER}.apk"

      - name: Keep the APK with this build
        uses: actions/upload-artifact@v4
        with:
          name: food-diary-0.1.${{ github.run_number }}
          path: out/*.apk

      - name: Keep test reports when tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

      - name: Publish as the latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Food diary 0.1.${{ github.run_number }}
          body: Automatic build of ${{ github.sha }}. Download the .apk file below on your phone to install.
          files: out/*.apk
          make_latest: true
