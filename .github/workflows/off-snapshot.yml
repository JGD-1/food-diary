# Makes the app's bundled list of Dutch and Belgian shop products from the Open Food Facts export
# (Round 9) and saves it to the branch it ran on. Runs only by hand, or when its script changes.
name: Open Food Facts list

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - feature/food/tools/off/**
      - .github/workflows/off-snapshot.yml

concurrency:
  group: off-snapshot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Download and filter the Open Food Facts export
        run: |
          curl -fsSL --retry 4 -A "FoodDiary-snapshot/1.0 (github.com/JGD-1/food-diary)" \
            https://static.openfoodfacts.org/data/en.openfoodfacts.org.products.csv.gz \
            | gunzip | python3 -I feature/food/tools/off/make_snapshot.py - feature/food/src/main/assets/off_nl.tsv.gz
          ls -l feature/food/src/main/assets/off_nl.tsv.gz
          echo "### Open Food Facts list: $(zcat feature/food/src/main/assets/off_nl.tsv.gz | grep -vc '^#\|^barcode|') products, $(du -h feature/food/src/main/assets/off_nl.tsv.gz | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Save the list to the branch
        run: |
          git add feature/food/src/main/assets/off_nl.tsv.gz
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update the bundled Open Food Facts list"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
