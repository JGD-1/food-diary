# Runs the camera module's on-device tests in an Android emulator.
# Separate from the main build and not required to merge. It takes about 8-10 minutes,
# so it only runs when camera code changes (or by hand), to save the free build minutes.
name: Camera device tests

on:
  pull_request:
    paths:
      - 'feature/camera/**'
  workflow_dispatch:

concurrency:
  group: camera-device-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run camera tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :feature:camera:connectedDebugAndroidTest
